name: Build Standalone APK and Deploy Web App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Capacitor App
        run: |
          mkdir -p www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.jpg" -o -name "*.png" -o -name "*.svg" \) -exec cp {} www/ \;
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/app@6
          npm install -D @capacitor/cli@6
          npx cap init "Mr Herres" "com.mrherres.app" --web-dir www
          npx cap add android

      - name: Intercept Android Hardware Back Button
        run: |
          cat << 'EOF' > android/app/src/main/java/com/mrherres/app/MainActivity.java
          package com.mrherres.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              WebView webView = getBridge().getWebView();
                              webView.evaluateJavascript("if (typeof window.handleAndroidBack === 'function') { window.handleAndroidBack(); } else { 'unhandled'; }", value -> {
                                  if (value != null && value.contains("handled") && !value.contains("unhandled")) {
                                      // Handled in JS
                                  } else {
                                      setEnabled(false);
                                      getOnBackPressedDispatcher().onBackPressed();
                                      setEnabled(true);
                                  }
                              });
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      webView.evaluateJavascript("if (typeof window.handleAndroidBack === 'function') { window.handleAndroidBack(); } else { 'unhandled'; }", value -> {
                          if (value != null && value.contains("handled") && !value.contains("unhandled")) {
                              // Handled in JS
                          } else {
                              runOnUiThread(() -> MainActivity.super.onBackPressed());
                          }
                      });
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate App Icons
        run: |
          python3 -m pip install pillow
          python3 -c "
          import os
          from PIL import Image

          img = Image.open('logo.jpg')
          size = max(img.size)
          square = Image.new('RGBA', (size, size), (12, 13, 16, 255))
          square.paste(img, ((size - img.width) // 2, (size - img.height) // 2))

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, s in sizes.items():
              d = os.path.join('android/app/src/main/res', folder)
              os.makedirs(d, exist_ok=True)
              resized = square.resize((s, s), Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  resized.save(os.path.join(d, name))
          "
          sed -i 's/<color name="ic_launcher_background">#FFFFFF<\/color>/<color name="ic_launcher_background">#0c0d10<\/color>/g' android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Herres-Trainingsapp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
