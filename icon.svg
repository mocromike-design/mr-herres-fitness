<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#2a303c" stroke-width="2"/>

  <!-- Glowing Barbell / Dumbbell Graphic -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="190" y="242" width="132" height="28" rx="6" fill="#e2e8f0"/>
    <rect x="220" y="246" width="72" height="20" rx="3" fill="#94a3b8"/>

    <!-- Inner Collars -->
    <rect x="176" y="232" width="14" height="48" rx="4" fill="url(#goldGrad)"/>
    <rect x="322" y="232" width="14" height="48" rx="4" fill="url(#goldGrad)"/>

    <!-- Weight Plates - Left -->
    <rect x="144" y="200" width="26" height="112" rx="8" fill="url(#goldGrad)"/>
    <rect x="114" y="216" width="24" height="80" rx="6" fill="#f59e0b"/>
    <rect x="88" y="228" width="20" height="56" rx="5" fill="#d97706"/>

    <!-- Weight Plates - Right -->
    <rect x="342" y="200" width="26" height="112" rx="8" fill="url(#goldGrad)"/>
    <rect x="374" y="216" width="24" height="80" rx="6" fill="#f59e0b"/>
    <rect x="404" y="228" width="20" height="56" rx="5" fill="#d97706"/>
  </g>

  <!-- "MR. HERRES" Text Badge at bottom -->
  <rect x="96" y="388" width="320" height="46" rx="23" fill="rgba(15, 18, 24, 0.85)" stroke="#374151" stroke-width="2"/>
  <text x="256" y="419" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="20" fill="#fbbf24" letter-spacing="4">MR. HERRES</text>
</svg>
